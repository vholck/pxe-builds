name: Build RPi UEFI stage image

# Builds the Raspberry Pi UEFI firmware (EDK2) for Pi 3, Pi 4 and Pi 5 from pinned
# sources and packages it into the image the pxe stack's rpi-uefi-stage service
# runs. The boot host only pulls the image.

on:
  push:
    branches: [main]
    paths:
      - rpi-uefi-build/**
      - dts/**
      - build.env
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (branch, tag, or full commit SHA). Defaults to the branch selected above.'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/vholck/pxe-builds/rpi-uefi

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Resolve SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Free runner disk space
        run: |
          # The EDK2 build image and workspace need more room than a stock runner has
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build UEFI firmware for Pi 3, Pi 4 and Pi 5
        run: |
          set -eu
          # Settings are read from build.env, never from workflow inputs.
          set -a
          . ./build.env
          set +a
          mkdir -p output
          docker build --build-arg "PFTF_REF=${PFTF_REF}" --build-arg "RPI5_UEFI_REF=${RPI5_UEFI_REF}" \
            --build-arg "RPI5_TFA_TAG=${RPI5_TFA_TAG}" --build-arg "RPI5_TFA_COMMIT=${RPI5_TFA_COMMIT}" \
            --build-arg "UEFI_IPXE_REF=${UEFI_IPXE_REF}" \
            --build-arg "RPI_DT_TAG=${RPI_DT_TAG}" --build-arg "RPI_DT_COMMIT=${RPI_DT_COMMIT}" \
            --build-context dts=dts -t rpi-uefi-build rpi-uefi-build
          # One container per model: each starts from pristine sources.
          for model in rpi3 rpi4 rpi5; do
            docker run --rm \
              -e MODEL="$model" \
              -e SERIAL= \
              -e UEFI_BUILD_TYPE="${UEFI_BUILD_TYPE}" \
              -e UEFI_BOOT_TIMEOUT="${UEFI_BOOT_TIMEOUT}" \
              -e UEFI_SYSTEM_TABLE="${UEFI_SYSTEM_TABLE}" \
              -e UEFI_RPI5_DT="${UEFI_RPI5_DT}" \
              -e UEFI_RAM_LIMIT_3GB="${UEFI_RAM_LIMIT_3GB}" \
              -e UEFI_IPV6="${UEFI_IPV6}" \
              -e UEFI_HDMI_MODE="${UEFI_HDMI_MODE}" \
              -e CONSOLE_MAIN="${CONSOLE_MAIN}" \
              -e START_ELF_VERSION="${START_ELF_VERSION}" \
              -e DTB_VERSION="${DTB_VERSION}" \
              -e DTBO_VERSION="${DTBO_VERSION}" \
              -e PUID="$(id -u)" \
              -e PGID="$(id -g)" \
              -v "$PWD/output:/out" \
              rpi-uefi-build
          done
          # Check the result: firmware present with a plausible size, boot files complete
          for model in rpi3 rpi4 rpi5; do
            fd="output/generic-$model/RPI_EFI.fd"
            size=$(stat -c %s "$fd")
            echo "$model: RPI_EFI.fd is $size bytes"
            [ "$size" -ge 1000000 ] && [ "$size" -le 8000000 ]
            test -s "output/generic-$model/config.txt"
            test -s "output/generic-$model/$model-uefi.txt"
            cat "output/generic-$model/$model-uefi.txt"
          done
          test -s output/generic-rpi3/start.elf
          test -s output/generic-rpi4/start4.elf
          test -s output/generic-rpi5/bcm2712-rpi-5-b.dtb

      - name: Build and push stage image
        env:
          SHA: ${{ steps.sha.outputs.sha }}
          TAG_LATEST: ${{ github.event_name == 'push' || inputs.ref == '' }}
        run: |
          set -eu
          mkdir -p stage-context/uefi
          cp -r output/generic-rpi3 stage-context/uefi/rpi3
          cp -r output/generic-rpi4 stage-context/uefi/rpi4
          cp -r output/generic-rpi5 stage-context/uefi/rpi5
          cp rpi-uefi-build/stage.sh stage-context/stage.sh
          docker build -f rpi-uefi-build/Dockerfile.stage -t "${IMAGE_NAME}:${SHA}" stage-context
          docker push "${IMAGE_NAME}:${SHA}"
          if [ "${TAG_LATEST}" = "true" ]; then
            docker tag "${IMAGE_NAME}:${SHA}" "${IMAGE_NAME}:latest"
            docker push "${IMAGE_NAME}:latest"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: rpi-uefi-${{ steps.sha.outputs.sha }}
          path: stage-context/uefi/
          retention-days: 30

      - name: Pin the image in the stacks repository
        if: github.event_name == 'push' || inputs.ref == ''
        uses: ./.github/actions/pin-in-stacks
        with:
          key: RPI_UEFI_IMAGE_TAG
          value: "${{ steps.sha.outputs.sha }}"
          message: "chore(pxe): pin rpi-uefi image to ${{ steps.sha.outputs.sha }}"
          token: ${{ secrets.STACKS_TOKEN }}
