name: Lint

# Static checks only; nothing is built or deployed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Shell scripts (shellcheck)
        run: |
          git ls-files '*.sh' | xargs shellcheck --severity=warning

      - name: Workflows (actionlint)
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

      - name: Compose files (local builds and examples)
        run: |
          set -eu
          for f in */docker-compose.yml examples/*/docker-compose.yml; do
            echo "== $f"
            env=build.env; case "$f" in examples/*) env="$(dirname "$f")/.env.example" ;; esac
            docker compose -f "$f" --env-file "$env" config --quiet
          done
