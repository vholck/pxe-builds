# dnsmasq configuration for network boot: ProxyDHCP + TFTP only.
# @NAME@ placeholders are filled in by stage.sh when the ipxe-build image runs.
# "tag:!custom" means "clients that do NOT carry the custom tag".

# No DNS listener; only ProxyDHCP and TFTP.
port=0

# ProxyDHCP: never hand out addresses, only add boot information to the main
# DHCP server's offers on this subnet.
dhcp-range=@LAN_GATEWAY@,proxy,@LAN_NETMASK@

enable-tftp
tftp-root=/var/lib/tftpboot

# --- This iPXE build (sends user-class @IPXE_PRODUCT_NAME@ on its DHCP re-probe) ---
# It receives the chain target instead of another copy of the iPXE binary.
dhcp-userclass=set:custom,@IPXE_PRODUCT_NAME@
# PXE service offers for all architectures ...
pxe-service=tag:custom,x86PC,"chain to menu",@IPXE_CHAIN_URI@
pxe-service=tag:custom,X86-64_EFI,"chain to menu",@IPXE_CHAIN_URI@
pxe-service=tag:custom,ARM64_EFI,"chain to menu",@IPXE_CHAIN_URI@
# ... and DHCP option 67, for firmware that reads that instead.
dhcp-boot=tag:custom,@IPXE_CHAIN_URI@

# Option 66 (TFTP server name) = this host. Note this does not change iPXE's
# ${next-server}; the embedded autoexec.ipxe copies ${proxydhcp/next-server} instead.
dhcp-option=66,0.0.0.0

# --- Raspberry Pi ---
# Tag Pi clients by MAC prefix.
dhcp-mac=set:pi,B8:27:EB:*:*:*
dhcp-mac=set:pi,DC:A6:32:*:*:*
dhcp-mac=set:pi,E4:5F:01:*:*:*
dhcp-mac=set:pi,2C:CF:67:*:*:*
dhcp-mac=set:pi,D8:3A:DD:*:*:*
# The Pi boot ROM only netboots when it sees this exact PXE menu entry. Scoped to
# the pi tag so x86 clients never see it.
pxe-service=tag:pi,0,"Raspberry Pi Boot"
# The Pi ROM sends client-arch 0 and is slow to process ProxyDHCP: delay the reply.
# U-Boot and this iPXE build are excluded; both time out if the reply is delayed.
dhcp-match=set:pxearch0,option:client-arch,0
dhcp-reply-delay=tag:pi,tag:pxearch0,tag:!custom,2

# --- ARM64 EFI PXE clients (client-arch 11), e.g. U-Boot on a Pi ---
dhcp-match=set:arm64efi,option:client-arch,11
# Pi: iPXE built with NAP_NULL. iPXE's default idle sleep freezes under U-Boot,
# which has no interrupt support to wake the CPU.
dhcp-boot=tag:pi,tag:arm64efi,tag:!custom,ipxe/snponly-arm64-rpi.efi,pxe,@PXE_LAN_IP@
# Option 209 makes U-Boot skip its pxelinux.cfg/ probing.
dhcp-option-force=tag:pi,tag:arm64efi,tag:!custom,209,ipxe/snponly-arm64-rpi.efi
# Any other ARM64 EFI client.
dhcp-boot=tag:arm64efi,tag:!custom,ipxe/snponly-arm64.efi,pxe,@PXE_LAN_IP@
dhcp-option-force=tag:arm64efi,tag:!custom,209,ipxe/snponly-arm64.efi

# --- Stock PXE firmware and stock iPXE: chainload this iPXE build over TFTP ---
# BIOS: IPXE_BIOS_FILE (default ipxe.kpxe: iPXE's own network drivers, the card's
# PXE ROM as fallback; undionly.kpxe: always the card's PXE ROM, slower). The
# machines listed in IPXE_BIOS_UNDI_MACS get undionly.kpxe whatever the default;
# stage.sh writes their dhcp-mac lines here. The two lines exclude each other.
#@BIOS_UNDI_MACS@
pxe-service=tag:!custom,tag:!biosundi,x86PC,"PXE chainload to iPXE (BIOS x86)",ipxe/@IPXE_BIOS_FILE@
pxe-service=tag:!custom,tag:biosundi,x86PC,"PXE chainload to iPXE (BIOS x86, card's PXE ROM)",ipxe/undionly.kpxe
pxe-service=tag:!custom,X86-64_EFI,"PXE chainload to iPXE (UEFI x86_64)",ipxe/snponly-x86_64.efi
pxe-service=tag:!custom,ARM64_EFI,"PXE chainload to iPXE (UEFI ARM64)",ipxe/snponly-arm64.efi

log-queries
log-dhcp
